# fly.toml app configuration file generated for gold-xau-masterpiece on 2026-10-29T03:42:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gold-xau-masterpiece'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "get"
  path = "/"

[vm]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
